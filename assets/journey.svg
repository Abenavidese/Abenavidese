<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Career timeline from 2024 to 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161237"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="20"/></clipPath>
    <style>
      .h    { font: 700 18px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .d    { font: 600 13px 'Cascadia Code', Consolas, monospace; fill: #22d3ee; }
      .t    { font: 400 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .head { font: 700 14px 'Cascadia Code', Consolas, monospace; fill: #64748b; letter-spacing: 3px; }
      .track { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 2.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .s { opacity: 0; animation: show .6s ease-out forwards; }
      .s1 { animation-delay: .3s; } .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.1s; }
      .s4 { animation-delay: 1.5s; } .s5 { animation-delay: 1.9s; }
      @keyframes show { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .now { animation: ping 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <text class="head" x="50" y="44">THE JOURNEY SO FAR</text>

    <line class="track" x1="50" y1="120" x2="1150" y2="120" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

    <g class="s s1">
      <circle cx="120" cy="120" r="9" fill="#0b1020" stroke="#22d3ee" stroke-width="4"/>
      <text class="d" x="120" y="96" text-anchor="middle">NOV 2024</text>
      <text class="h" x="120" y="160" text-anchor="middle">UPS Internship</text>
      <text class="t" x="120" y="184" text-anchor="middle">Python · SQL · PL/SQL</text>
    </g>
    <g class="s s2">
      <circle cx="350" cy="120" r="9" fill="#0b1020" stroke="#22d3ee" stroke-width="4"/>
      <text class="d" x="350" y="96" text-anchor="middle">APR 2025</text>
      <text class="h" x="350" y="160" text-anchor="middle">ETIKOS Internship</text>
      <text class="t" x="350" y="184" text-anchor="middle">EMV QR payments</text>
    </g>
    <g class="s s3">
      <circle cx="580" cy="120" r="9" fill="#0b1020" stroke="#818cf8" stroke-width="4"/>
      <text class="d" x="580" y="96" text-anchor="middle">DEC 2025</text>
      <text class="h" x="580" y="160" text-anchor="middle">Freelance Dev</text>
      <text class="t" x="580" y="184" text-anchor="middle">2 clients · web apps</text>
    </g>
    <g class="s s4">
      <circle cx="810" cy="120" r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="4"/>
      <text class="d" x="810" y="96" text-anchor="middle">FEB 2026</text>
      <text class="h" x="810" y="160" text-anchor="middle">BEng Computer Science</text>
      <text class="t" x="810" y="184" text-anchor="middle">Universidad Politécnica Salesiana</text>
    </g>
    <g class="s s5">
      <circle class="now" cx="1050" cy="120" r="9" fill="#f472b6"/>
      <circle cx="1050" cy="120" r="9" fill="#0b1020" stroke="#f472b6" stroke-width="4"/>
      <text class="d" x="1050" y="96" text-anchor="middle" style="fill:#f472b6">FEB – OCT 2026</text>
      <text class="h" x="1050" y="160" text-anchor="middle">F.S.O. Group · Pandora</text>
      <text class="t" x="1050" y="184" text-anchor="middle">ERP to production · 5 companies</text>
    </g>

    <text class="t" x="600" y="232" text-anchor="middle" style="fill:#64748b">+ ML contract with CEDIA (ICDAS dental AI) · ETH Ecuador core team · hackathons</text>
  </g>
</svg>
