<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Anthony Benavides — AI and Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .title { font: 800 64px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .sub   { font: 600 24px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: url(#accent); }
      .meta  { font: 500 16px 'Cascadia Code', Consolas, 'SFMono-Regular', monospace; fill: #94a3b8; }
      .tag   { font: 600 14px 'Cascadia Code', Consolas, monospace; fill: #e2e8f0; }
      .fade1 { opacity: 0; animation: up .9s ease-out .1s forwards; }
      .fade2 { opacity: 0; animation: up .9s ease-out .45s forwards; }
      .fade3 { opacity: 0; animation: up .9s ease-out .8s forwards; }
      .fade4 { opacity: 0; animation: up .9s ease-out 1.15s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .edge  { stroke: #818cf8; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      .node  { fill: #22d3ee; animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .4s; fill: #818cf8; } .n3 { animation-delay: .8s; fill: #f472b6; }
      .n4 { animation-delay: 1.2s; } .n5 { animation-delay: 1.6s; fill: #818cf8; } .n6 { animation-delay: 2s; fill: #f472b6; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.6); opacity: .45; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orb { animation: drift 9s ease-in-out infinite alternate; }
      @keyframes drift { to { transform: translate(-60px, 30px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb" cx="930" cy="140" r="260" fill="url(#glow)"/>

    <!-- neural graph -->
    <g>
      <line class="edge" x1="820" y1="90"  x2="930" y2="160"/>
      <line class="edge" x1="820" y1="230" x2="930" y2="160"/>
      <line class="edge" x1="930" y1="160" x2="1050" y2="80"/>
      <line class="edge" x1="930" y1="160" x2="1050" y2="240"/>
      <line class="edge" x1="1050" y1="80" x2="1120" y2="160"/>
      <line class="edge" x1="1050" y1="240" x2="1120" y2="160"/>
      <line class="edge" x1="820" y1="90" x2="1050" y2="80"/>
      <line class="edge" x1="820" y1="230" x2="1050" y2="240"/>
      <circle class="node"    cx="820"  cy="90"  r="7"/>
      <circle class="node n2" cx="820"  cy="230" r="7"/>
      <circle class="node n3" cx="930"  cy="160" r="10"/>
      <circle class="node n4" cx="1050" cy="80"  r="7"/>
      <circle class="node n5" cx="1050" cy="240" r="7"/>
      <circle class="node n6" cx="1120" cy="160" r="9"/>
    </g>

    <!-- text -->
    <text class="meta fade1" x="64" y="78">~/cuenca-ecuador $ whoami<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
    <text class="title fade2" x="60" y="150">Anthony Benavides</text>
    <text class="sub fade3" x="64" y="192">AI Engineer · Full-Stack Developer · Web3 Builder</text>

    <g class="fade4">
      <rect x="64"  y="222" width="190" height="34" rx="17" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
      <text class="tag" x="159" y="244" text-anchor="middle">LLM · RAG · Agents</text>
      <rect x="266" y="222" width="190" height="34" rx="17" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/>
      <text class="tag" x="361" y="244" text-anchor="middle">Computer Vision</text>
      <rect x="468" y="222" width="190" height="34" rx="17" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".5"/>
      <text class="tag" x="563" y="244" text-anchor="middle">Microservices</text>
    </g>

    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
